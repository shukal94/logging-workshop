[loggers]
keys=root,sftp,utils,test,db

[handlers]
keys=consoleHandler

[formatters]
keys=consoleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_sftp]
level=INFO
handlers=consoleHandler
qualname=sftp
propagate=0

[logger_db]
level=INFO
handlers=consoleHandler
qualname=db
propagate=0

[logger_utils]
level=INFO
handlers=consoleHandler
qualname=utils
propagate=0

[logger_test]
level=INFO
handlers=consoleHandler
qualname=test
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=consoleFormatter
args=(sys.stdout,)

[formatter_consoleFormatter]
format=%(asctime)s %(name)s [%(levelname)s] - %(message)s
datefmt=
